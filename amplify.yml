version: 1

# PrayTogether — Amplify Gen 2 build spec
# Backend: AppSync + DynamoDB via Amplify Gen 2
# Frontend: Vite + React + TypeScript

backend:
  phases:
    build:
      commands:
        - npm install --no-fund
        # Deploy backend resources and write amplify_outputs.json to project root
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
        # Confirm the file was written with real values
        - cat amplify_outputs.json

frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-fund
        # Pull the real amplify_outputs.json from the deployed backend in case
        # the git-committed placeholder is still on disk
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
        # Verify the file has a real AppSync URL before building
        - cat amplify_outputs.json
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
