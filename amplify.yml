version: 1

# PrayTogether — Amplify Gen 2 build spec
# Frontend: Vite + React + TypeScript
# Backend:  Amplify Gen 2 (AppSync + DynamoDB) in amplify/

backend:
  phases:
    build:
      commands:
        - npm install -g @aws-amplify/backend-cli --force
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
