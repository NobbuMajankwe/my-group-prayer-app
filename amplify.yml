version: 1

# PrayTogether — Amplify Gen 2 build spec
# Frontend: Vite + React + TypeScript
# Backend:  Amplify Gen 2 (AppSync + DynamoDB) in amplify/

backend:
  phases:
    build:
      commands:
        - npm install --no-fund
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm install --no-fund
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*